# Custom firmware = stock Voice PE config + our additions.
# Build/flash over USB (needs the Python esphome CLI: `pipx install esphome`):
#   esphome run firmware/havoice.yaml --device /dev/cu.usbmodem3101
# NOT flashed yet. If you flash this, give HA the same api key (or re-adopt the device).
substitutions:
  name: home-assistant-voice-0ae0b7
  friendly_name: Home Assistant Voice 0ae0b7

packages:
  Nabu Casa.Home Assistant Voice PE: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml
  # grove-i2c: github://esphome/home-assistant-voice-pe/modules/grove-i2c.yaml
  # grove-power: github://esphome/home-assistant-voice-pe/modules/grove-power.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret api_key   # same value as HAVOICE_KEY

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
