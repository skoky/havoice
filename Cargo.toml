[package]
name = "havoice"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Drive a Home Assistant Voice Preview Edition (ESPHome) from Rust: LED ring, speaker, speech, buttons, internet radio, wake word models - with or without Home Assistant"
license = "MIT"
repository = "https://github.com/skoky/havoice"
documentation = "https://docs.rs/havoice"
readme = "README.md"
keywords = ["esphome", "home-assistant", "voice", "smart-speaker", "iot"]
categories = ["hardware-support", "multimedia::audio", "api-bindings", "command-line-utilities"]
# whitelist, so local secrets (.env, firmware/secrets.yaml), downloaded models and build
# caches never ship; the leading / anchors each pattern to the crate root
include = [
    "/src/**/*.rs",
    "/examples/*.rs",
    "/tests/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/.env.example",
    "/firmware/havoice.yaml",
    "/firmware/secrets.yaml.example",
]

[features]
default = ["cli"]
# the `havoice` command-line tool
cli = ["dep:clap", "dep:chrono"]

[[bin]]
name = "havoice"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", optional = true }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
dotenvy = "0.15.7"
esphome-client = { version = "0.2.1", features = ["api-1-16"] }
flacenc = "0.5.1"
getrandom = "0.4.3"
mdns-sd = "0.21.7"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
esphome-native-api = "3.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
rpassword = "7.5.5"

[package.metadata.docs.rs]
all-features = true
