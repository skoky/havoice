[package]
name = "havoice"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
esphome-client = { version = "0.2.1", features = ["api-1-16"] }
flacenc = "0.5.1"
getrandom = "0.4.3"
mdns-sd = "0.21.7"
regex = "1.13.1"
serialport = "4.10.1"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
esphome-native-api = "3.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
rpassword = "7.5.5"
serde_json = "1.0.154"
